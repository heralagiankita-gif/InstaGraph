<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>InstaGraph</title>
    <base href="/" />
    <!-- viewport-fit=cover lets the layout run under a notch; the safe-area insets in styles.css then
         push the bars back out of it. Without both, a phone either letterboxes the app or hides its
         navigation behind the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />

    <!-- Installed as an app: no browser chrome, and a status bar that matches whichever theme is on. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InstaGraph" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Three faces, one request. Grand Hotel is the wordmark (Instagram's is Billabong, and this is
         the closest free match); Plus Jakarta Sans is the interface; Bricolage Grotesque only ever
         appears large, so it is loaded at the two weights the headings actually use. Everything falls
         back to the system stack, so the layout is identical before any of it arrives. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap"
      rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e1306c'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='23' cy='9' r='1.8' fill='white'/%3E%3C/svg%3E" />
  </head>
  <body>
    <app-root></app-root>

    <script>
      // Runs before Angular boots so a dark-theme user never sees a white flash first, and so the
      // page never paints one vibe's colours and then swaps to another a frame later.
      (function () {
        var root = document.documentElement;

        try {
          var t = localStorage.getItem('instagraph.theme');
          if (t === 'light' || t === 'dark') {
            root.setAttribute('data-theme', t);
          }

          // Keep this list in step with core/vibe.service.ts. Anything unrecognised — or nothing
          // stored at all — leaves the attribute off, which is Aurora.
          var v = localStorage.getItem('instagraph.vibe');
          if (['sunset', 'y2k', 'matcha', 'cyber', 'bubblegum', 'classic'].indexOf(v) >= 0) {
            root.setAttribute('data-vibe', v);
          }

          if (localStorage.getItem('instagraph.aura') === 'off') {
            root.setAttribute('data-aura', 'off');
          }
        } catch (e) {
          /* private mode: fall back to following the system */
        }
      })();

      // The service worker is registered from the app rather than here, because it must only ever be
      // installed in a real build — in front of a dev server it answers with chunks that no longer
      // exist. See core/pwa.service.ts.
    </script>
  </body>
</html>
